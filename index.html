<!DOCTYPE html>
<html lang="en">
    <head>
    <meta name="google-site-verification" content="5cj3qOism9CfwtfxMjUsYh1d72wn71YkzXtA3SDOlWE" />
    <meta charset="UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anime11 - an anime-themed loading page.">
    <meta property="og:site_name" content="Anime11">
    <meta property="og:title" content="Anime11">
    <title>Anime11</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #fff;
            font-family: Poppins, sans-serif;
            background:
                linear-gradient(rgba(4, 8, 14, 0.58), rgba(4, 8, 14, 0.82)),
                url("pain-nagato-black-3840x2160-26691.jpg") center / cover no-repeat,
                darkslategray;
        }

        .loader {
            width: min(360px, calc(100vw - 40px));
            padding: 38px 32px 32px;
            text-align: center;
            background: rgba(8, 12, 18, 0.82);
            border: 1px solid rgba(255, 220, 45, 0.55);
            border-radius: 14px;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            animation: appear 700ms ease-out both;
        }

        .spinner {
            width: 58px;
            height: 58px;
            margin: 0 auto 22px;
            border: 4px solid rgba(255, 255, 255, 0.18);
            border-top-color: #ffdc2d;
            border-right-color: #ffdc2d;
            border-radius: 50%;
            animation: spin 900ms linear infinite;
        }

        h1 {
            margin: 0;
            color: #ffdc2d;
            font-size: 1.5rem;
            letter-spacing: 0.16em;
        }

        .status {
            min-height: 1.5em;
            margin: 8px 0 24px;
            color: rgba(255, 255, 255, 0.76);
            font-size: 0.9rem;
        }

        .progress-track {
            height: 7px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 99px;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, #ff9d00, #ffec52);
            border-radius: inherit;
            box-shadow: 0 0 14px rgba(255, 220, 45, 0.7);
            transition: width 180ms ease-out;
        }

        .progress-label {
            display: block;
            margin-top: 12px;
            color: #ffdc2d;
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
        }

        .loader.is-ready .spinner {
            animation: none;
            border-color: #ffdc2d;
            box-shadow: 0 0 22px rgba(255, 220, 45, 0.4);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main class="loader" id="loader" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <h1 id="title">LOADING</h1>
        <p class="status" id="status">Preparing your experience...</p>
        <div
            class="progress-track"
            role="progressbar"
            aria-label="Loading progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            id="progressTrack"
        >
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <span class="progress-label" id="progressLabel">0%</span>
    </main>

    <script>
        const loader = document.getElementById("loader");
        const title = document.getElementById("title");
        const status = document.getElementById("status");
        const progressBar = document.getElementById("progressBar");
        const progressLabel = document.getElementById("progressLabel");
        const progressTrack = document.getElementById("progressTrack");

        const messages = [
            { at: 0, text: "Preparing your experience..." },
            { at: 30, text: "Gathering the details..." },
            { at: 65, text: "Almost there..." },
            { at: 90, text: "Finishing up..." }
        ];

        let progress = 0;

        function updateProgress() {
            progress = Math.min(progress + Math.ceil(Math.random() * 4), 100);

            const currentMessage = messages
                .slice()
                .reverse()
                .find((message) => progress >= message.at);

            progressBar.style.width = `${progress}%`;
            progressLabel.textContent = `${progress}%`;
            progressTrack.setAttribute("aria-valuenow", progress);
            status.textContent = currentMessage.text;

            if (progress === 100) {
                title.textContent = "READY";
                status.textContent = "Your experience is ready.";
                loader.classList.add("is-ready");
                return;
            }

            window.setTimeout(updateProgress, 70 + Math.random() * 100);
        }

        window.setTimeout(updateProgress, 350);
    </script>
</body>
</html>
